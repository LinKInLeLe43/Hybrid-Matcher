_target_: src.data.MatchingDataModule
train_configs:
  megadepth:
    npz_root: "${paths.data_dir}/megadepth/index/scene_info_0.1_0.7"
    list_path: "${paths.data_dir}/megadepth/index/trainvaltest_list/train_list.txt"
    dataset:
      _target_: src.data.components.datasets.MegaDepthDataset
      _partial_: true
      data_root: "${paths.data_dir}/megadepth/train"
      image_size: 640
      image_factor: 32
      mask_factors: [8, 16, 32]
    sampler:
      _target_: src.data.components.samplers.RandomConcatSampler
      _partial_: true
      samples_count_per_subset: 100
      seed: ${seed}
  scannet:
    npz_root: "${paths.data_dir}/scannet/index/scene_data/train"
    list_path: "${paths.data_dir}/scannet/index/scene_data/train_list/scannet_all.txt"
    dataset:
      _target_: src.data.components.datasets.ScanNetDataset
      _partial_: true
      data_root: "${paths.data_dir}/scannet/train"
      intrinsic_path: "${paths.data_dir}/scannet/index/intrinsics.npz"
      min_overlap_score: 0.4
    sampler:
      _target_: src.data.components.samplers.RandomConcatSampler
      _partial_: true
      samples_count_per_subset: 200
      seed: ${seed}

train_batch_size_per_gpu: ???

val_config:
  npz_root: "${paths.data_dir}/scannet/index/scannet_test_1500"
  list_path: "${paths.data_dir}/scannet/index/scannet_test_1500/scannet_test.txt"
  dataset:
    _target_: src.data.components.datasets.ScanNetDataset
    _partial_: true
    data_root: "${paths.data_dir}/scannet/test"
    intrinsic_path: "${paths.data_dir}/scannet/index/scannet_test_1500/intrinsics.npz"
  sampler:
    _target_: torch.utils.data.DistributedSampler
    _partial_: true
    shuffle: false

test_config:
  npz_root: "${paths.data_dir}/scannet/index/scannet_test_1500"
  list_path: "${paths.data_dir}/scannet/index/scannet_test_1500/scannet_test.txt"
  dataset:
    _target_: src.data.components.datasets.ScanNetDataset
    _partial_: true
    data_root: "${paths.data_dir}/scannet/test"
    intrinsic_path: "${paths.data_dir}/scannet/index/scannet_test_1500/intrinsics.npz"
    fp16: ${fp16}
  sampler:
    _target_: torch.utils.data.DistributedSampler
    _partial_: true
    shuffle: false

workers_count: 8

seed: ${seed}

parallel: true
