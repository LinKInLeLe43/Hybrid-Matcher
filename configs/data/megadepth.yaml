_target_: src.data.MatchingDataModule
train_config:
    list_path: "${paths.data_dir}/megadepth/index/trainvaltest_list/train_list.txt"
    npz_root: "${paths.data_dir}/megadepth/index/scene_info_0.1_0.7"
    dataset_builder:
        _target_: src.data.datasets.MegaDepthDataset
        _partial_: true
        data_root: "${paths.data_dir}/megadepth/train"
        mode: "${model.net.config.data_mode}"
        image_size: 832
        image_factor: 32
        mask_factor: 8
    sampler_builder:
        _target_: src.data.samplers.RandomConcatSampler
        _partial_: true
        num_samples_per_scene: 100
        seed: ${seed}
train_batch_size_per_gpu: 1
val_config:
    list_path: "${paths.data_dir}/megadepth/index/trainvaltest_list/val_list.txt"
    npz_root: "${paths.data_dir}/megadepth/index/scene_info_val_1500"
    dataset_builder:
        _target_: src.data.datasets.MegaDepthDataset
        _partial_: true
        data_root: "${paths.data_dir}/megadepth/test"
        mode: "${model.net.config.data_mode}"
        image_size: ${data.train_config.dataset_builder.image_size}
        image_factor: ${data.train_config.dataset_builder.image_factor}
        mask_factor: ${data.train_config.dataset_builder.mask_factor}
    sampler_builder:
        _target_: torch.utils.data.DistributedSampler
        _partial_: true
        shuffle: false
test_config:
    list_path: "${paths.data_dir}/megadepth/index/trainvaltest_list/val_list.txt"
    npz_root: "${paths.data_dir}/megadepth/index/scene_info_val_1500"
    dataset_builder:
        _target_: src.data.datasets.MegaDepthDataset
        _partial_: true
        data_root: "${paths.data_dir}/megadepth/test"
        mode: "${model.net.config.data_mode}"
        image_size: 1152
        image_factor: 32
        mask_factor: 8
        fp16: ${fp16}
    sampler_builder:
        _target_: torch.utils.data.DistributedSampler
        _partial_: true
        shuffle: false
num_workers: 8
seed: ${seed}
