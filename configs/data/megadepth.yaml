_target_: src.data.MatchingDataModule
train_configs:
  megadepth:
    npz_root: "${paths.data_dir}/megadepth/index/scene_info_0.1_0.7"
    list_path: "${paths.data_dir}/megadepth/index/trainvaltest_list/train_list.txt"
    dataset:
      _target_: src.data.components.datasets.MegaDepthDataset
      _partial_: true
      data_root: "${paths.data_dir}/megadepth/train"
      image_size: 832
      image_factor: 32
      mask_factors: [8, 16, 32]
    sampler:
      _target_: src.data.components.samplers.RandomConcatSampler
      _partial_: true
      samples_count_per_subset: 100
      seed: ${seed}

train_batch_size_per_gpu: ???

val_config:
  npz_root: "${paths.data_dir}/megadepth/index/scene_info_val_1500"
  list_path: "${paths.data_dir}/megadepth/index/trainvaltest_list/val_list.txt"
  dataset:
    _target_: src.data.components.datasets.MegaDepthDataset
    _partial_: true
    data_root: "${paths.data_dir}/megadepth/test"
    image_size: ${data.train_configs.megadepth.dataset.image_size}
    image_factor: ${data.train_configs.megadepth.dataset.image_factor}
    mask_factors: ${data.train_configs.megadepth.dataset.mask_factors}
  sampler:
    _target_: torch.utils.data.DistributedSampler
    _partial_: true
    shuffle: false

test_config:
  npz_root: "${paths.data_dir}/megadepth/index/scene_info_val_1500"
  list_path: "${paths.data_dir}/megadepth/index/trainvaltest_list/val_list.txt"
  dataset:
    _target_: src.data.components.datasets.MegaDepthDataset
    _partial_: true
    data_root: "${paths.data_dir}/megadepth/test"
    image_size: ${data.train_configs.megadepth.dataset.image_size}
    image_factor: ${data.train_configs.megadepth.dataset.image_factor}
    mask_factors: ${data.train_configs.megadepth.dataset.mask_factors}
    fp16: ${fp16}
  sampler:
    _target_: torch.utils.data.DistributedSampler
    _partial_: true
    shuffle: false

workers_count: 8

seed: ${seed}
