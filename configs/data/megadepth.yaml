defaults:
    - dataset_wrappers/megadepth@train_dataset_wrapper
    - dataset_wrappers/megadepth@val_dataset_wrapper
    - _self_

_target_: src.data.SceneBalancedDataModule
train_scene_list_path: "${paths.data_dir}/megadepth/index/trainvaltest_list/train_list.txt"
train_dataset_wrapper:
    npz_root: "${paths.data_dir}/megadepth/index/scene_info_0.1_0.7"
    data_root: "${paths.data_dir}/megadepth/train"
train_num_samples_per_scene: 100
train_batch_size_per_device: ???
val_scene_list_path: "${paths.data_dir}/megadepth/index/trainvaltest_list/val_list.txt"
val_dataset_wrapper:
    npz_root: "${paths.data_dir}/megadepth/index/scene_info_val_1500"
    data_root: ${paths.data_dir}/megadepth/test
test_scene_list_path: ${.val_scene_list_path}
test_dataset_wrapper: ${.val_dataset_wrapper}
num_workers: 8
pin_memory: True
seed: ${seed}
parallel: False
