_target_: src.models.MatchingModule

net:
  _target_: src.models.components.nets.new_matcher.NewMatcherNet
  backbone:
    _target_: src.models.components.nets.new_matcher.backbone.ResNetFpn82
    initial_depth: 128
    layer_depths: [128, 196, 256]
  positional_encoding:
    _target_: src.models.components.nets.new_matcher.SinePositionalEncoding
    depth: ${model.net.backbone.layer_depths.2}
    train_size: [832, 832]
  local_coc:
    _target_: src.models.components.nets.new_matcher.LocalCoC
    blocks_counts: [2, 2, 2]
    layer_depths: [256, 256, 256]
    hidden_depths: [256, 256, 256]
    heads_counts: [8, 8, 8]
    center_sizes: [8, 4, 2]
    fold_sizes: [1, 1, 1]
  coarse_module:
    _target_: src.models.components.nets.new_matcher.GlobalCoC
    in_depth: ${model.net.local_coc.layer_depths.0}
    hidden_depth: 256
    heads_count: 8
    types: ["cross", "cross", "cross", "cross"]
    use_matchability: true
  coarse_matching:
    _target_: src.models.components.nets.new_matcher.CoarseMatching
    use_matchability: ${model.net.coarse_module.use_matchability}
  fine_preprocess:
    _target_: src.models.components.nets.new_matcher.FinePreprocess
    type: "eloftr"
    window_size: 8
    stride: 8
    padding: 0
    right_extra: 1
    depths: ${model.net.backbone.layer_depths}
    scale_before_crop: 2
#    window_size: 5
#    stride: 4
#    padding: 2
  fine_module:
    _target_: src.models.components.nets.new_matcher.LoFTR
    depth: ${model.net.backbone.layer_depths.0}
    heads_count: 8
    attention:
      _target_: src.models.components.nets.new_matcher.FullAttention
    types: ["self", "cross"]
  fine_matching:
    _target_: src.models.components.nets.new_matcher.FineMatching
#    type: "one_stage"
#    reg_window_size: ${model.net.fine_preprocess.window_size}
#    reg_with_std: true
    type: "two_stage"
    cls_window_size: ${model.net.fine_preprocess.window_size}
    cls_depth: 112
    reg_window_size: 3
    reg_with_std: false
    reg_temperature: 10.0

loss:
  _target_: src.models.components.losses.NewMatcherLoss
  coarse_cls_sparse: ???
  coarse_cls_loss_pos_weight: 1.0
  coarse_cls_loss_neg_weight: 1.0
  fine_cls_sparse: ???
  fine_cls_loss_pos_weight: 1.0
  fine_cls_loss_neg_weight: 1.0
  fine_reg_loss_weight: 1.0

optimizer: ???

scheduler: ???

train_batch_size_per_gpu: ${data.train_batch_size_per_gpu}

canonical_batch_size: ???

canonical_learning_rate: ???

canonical_warmup_step_count: ???

warmup_ratio: ???

end_point_thresholds: ???

epipolar_thresholds: ???

pose_thresholds: ???
