_target_: src.models.MatchingModule

net:
    _target_: src.models.components.nets.new_matcher.NewMatcherNet
    rope:
        _target_: src.models.components.nets.new_matcher.RoPESinePositionalEncoding
        dim: ${model.net.local_coc.layer_depths.0}
        train_size: ???
        test_size: ???
        fp16: ${fp16}
    local_coc:
        _target_: src.models.components.nets.new_matcher.LocalCoC
        initial_depth: 192
        scales: [2, 2]
        blocks_counts: [2, 2]
        layer_depths: [256, 256]
        num_heads_list: [8, 8]
        center_sizes: [4, 2]
        fold_sizes: [1, 1]
    coarse_module:
        _target_: src.models.components.nets.new_matcher.GlobalCoC
        stride: 2
        in_depth: ${model.net.local_coc.layer_depths.0}
        num_heads: 8
        layer_count: 2
        attention_block:
            _target_: src.models.components.nets.new_matcher.TransformerBlock
            dim: ${model.net.coarse_module.in_depth}
            num_heads: ${model.net.coarse_module.num_heads}
            stride: ${model.net.coarse_module.stride}
    coarse_matching:
        _target_: src.models.components.nets.new_matcher.CoarseMatching
        fused_selective_module:
            _target_: src.models.components.nets.new_matcher.RegionSelectiveTransformer
            dim_list:
                - 192
                - 256
            num_heads: 8
            stride: 2
            num_layers: 2
        temperature: 0.1
    extra_scale: 16
    enable_crop: true

