_target_: src.models.MatchingModule

net:
  _target_: src.models.components.nets.new_matcher.NewMatcherNet
  type: ???
  backbone:
    _target_: src.models.components.nets.new_matcher.backbones.RepVgg82
    block_counts: [2, 4, 4]
    layer_depths: [64, 128, 256]
  local_coc:
    _target_: src.models.components.nets.new_matcher.LocalCoC
    scales: [2, 2]
    blocks_counts: [2, 2]
    layer_depths: [256, 256]
    hidden_depths: [256, 256]
    heads_counts: [8, 8]
    center_sizes: [4, 2]
    fold_sizes: [1, 1]
  coarse_module:
    _target_: src.models.components.nets.new_matcher.GlobalCoC
    scale: 2
    in_depth: ${model.net.local_coc.layer_depths.0}
    hidden_depth: ${model.net.coarse_module.in_depth}
    heads_count: 8
    layer_count: 2
    attention_block:
      _target_: src.models.components.nets.new_matcher.AggregatedEncoder
      depth: ${model.net.coarse_module.in_depth}
      heads_count: ${model.net.coarse_module.heads_count}
      scale: ${model.net.coarse_module.scale}
      attention:
        _target_: src.models.components.nets.new_matcher.Attention
  coarse_matching:
    _target_: src.models.components.nets.new_matcher.CoarseMatching
    depth: ${model.net.local_coc.layer_depths.0}
    fused_selective_module:
      _target_: src.models.components.nets.new_matcher.FusedSelectiveTransformer
      scale: 2
      depths:
        - ${model.net.backbone.layer_depths.2}
        - ${model.net.local_coc.layer_depths.0}
      encoder:
        _target_: src.models.components.nets.new_matcher.ConvTransformerEncoder
        scale: ${model.net.coarse_matching.fused_selective_module.scale}
        depth: ${model.net.coarse_matching.fused_selective_module.depths.0}
        heads_count: 8
        attention:
          _target_: src.models.components.nets.new_matcher.Attention
      layer_count: 2
    use_matchability: true
    temperature: 0.1
  fine_preprocess: ???
#  fine_module: ???
  fine_reg_matching: ???
  extra_scale: 16

loss: ???

optimizer: ???

scheduler: ???

