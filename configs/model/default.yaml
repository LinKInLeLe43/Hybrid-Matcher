_target_: src.models.MatchingModule
net:
    _target_: src.models.nets.CasP
    encoder: "repvgg_a1"
    rope:
        _target_: src.models.nets.RoPESinePositionalEncoding
        depth: 256
        train_size: ???
        test_size: ???
        fp16: ${fp16}
    coarse_matching:
        _target_: src.models.nets.CoarseMatching
        decoder:
            _target_: src.models.nets.decoders.Decoder
            stride: 2
            topk: 8
            dims:
                - 256
                - 128
            num_x_layers: 2
            num_y_layers: 1
            num_heads: 8
    num_coarse_matchings: 2
    extra_scale: 16
loss:
    _target_: src.models.losses.NewMatcherLoss
    coarse_cls_sparse: true
    coarse_cls_loss_pos_weight: 1.0
    coarse_cls_loss_neg_weight: 1.0
    extra_coarse_cls_sparse: false
    extra_coarse_cls_loss_pos_weight: 0.5
    extra_coarse_cls_loss_neg_weight: 0.5
optimizer: ???
scheduler: ???
train_batch_size_per_gpu: ${data.train_batch_size_per_gpu}
test_fp16_precision: ${fp16}
canonical_batch_size: ???
canonical_learning_rate: ???
canonical_warmup_step_count: ???
warmup_ratio: ???
metric_config:
    sym_epi:
        thresholds: [1e-4, 5e-4]
    end_point:
        thresholds: [1.0, 3.0, 5.0]
    rel_pose:
        num_evals: 5
        ransac_type: "ransac"
        thresholds: [5.0, 10.0, 20.0]

