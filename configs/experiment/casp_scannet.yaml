# @package _global_

defaults:
    - override /model/net: casp
    - override /model/loss: casp
    - override /data: scannet
    - _self_

callbacks:
    model_checkpoint:
        filename: "epoch={epoch}-auc@5={val_metric/rel_pose_auc@5:.3f}-auc@10={val_metric/rel_pose_auc@10:.3f}-auc@20={val_metric/rel_pose_auc@20:.3f}-prec={val_metric/coarse_prec@1:.3f}"
        monitor: "val_metric/rel_pose_auc@10"
        save_top_k: 15
        mode: "max"
        auto_insert_metric_name: false

model:
    net:
        config:
            train_size: 640
            test_size: 640
    optimizer:
        _target_: torch.optim.AdamW
        _partial_: true
        weight_decay: 0.1
    scheduler:
        _target_: torch.optim.lr_scheduler.MultiStepLR
        _partial_: true
        milestones: [3, 6, 9, 12, 17, 20, 23, 26, 29]
        gamma: 0.5
    canonical_batch_size: 64
    canonical_learning_rate: 6e-3
    canonical_warmup_step_count: 4800
    warmup_ratio: 0.0
    metric_thresholds:
        sym_epi_prec: [5e-4, 1e-4]
        rel_pose_auc: [5, 10, 20]
        end_point_prec: [1, 3, 5]
    rel_pose_ransac_config:
        estimator: "opencv"
        num_repeats: 5
        params:
            method: "RANSAC"
